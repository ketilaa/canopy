id: order
story: |
  A customer can place an order for a product in a quantity. The order total is the product price times
  the quantity, less 10 percent when that net total is strictly more than 500.00. A net total of exactly
  500.00 is NOT more than 500.00 and must NOT get the discount. A quantity that is zero or negative is
  rejected. A placed order can be looked up by its id.
steps:
  - id: order-1-order
    instruction: >
      Create the class Order in the package no.experis.orders: a Java record with an id (UUID), a
      customerId (String), a productId (String), a quantity (int) and a total (BigDecimal). Add a static
      factory method Order.place(String customerId, String productId, BigDecimal unitPrice, int quantity)
      that generates a random UUID for the id and computes the total: unitPrice times quantity, and when
      that amount is strictly more than 500.00, 10 percent less. A net total of exactly 500.00 is NOT
      more than 500.00 and must NOT get the discount; only a net total strictly above 500.00 gets it. The
      total always has two decimals (setScale(2, RoundingMode.HALF_UP)), so new BigDecimal("480.00")
      equals it. A quantity of zero or less makes place throw IllegalArgumentException with the message
      "Quantity must be positive". Add OrderTest with tests, using these examples: unit price 100.00 and
      quantity 1 gives the total 100.00; unit price 60.00 gives the totals 480.00 for quantity 8, 486.00
      for 9 and 540.00 for 10; unit price 100.00 and quantity 5 gives a net total of exactly 500.00, which
      is NOT more than 500.00 and must get no discount, so the total stays 500.00; unit price 50.01 and
      quantity 10 gives a net total of 500.10, which IS more than 500.00 and must get the discount,
      totaling 450.09; quantity 0 and quantity -1 each throw IllegalArgumentException with the message
      "Quantity must be positive"; two placed orders get different ids.
    create:
      - src/main/java/no/experis/orders/Order.java
      - src/test/java/no/experis/orders/OrderTest.java
    covers: [place-an-order-for-one-product, a-net-total-of-500-00-or-more-gets-a-10-percent-volume-discount, a-quantity-that-is-not-positive-is-rejected]
  - id: order-2-service
    instruction: >
      Create OrderService in the package no.experis.orders, with a no-argument constructor and a
      HashMap from id to Order. Add the method Order placeOrder(String customerId, String productId,
      BigDecimal unitPrice, int quantity), which creates the order with Order.place, stores it by its id
      and returns it, and the method Optional<Order> findById(UUID id). Add OrderServiceTest with tests
      that an order placed for customer "CUST-001" and product "PROD-A" at 100.00, quantity 1, can be
      found by its id and that the found order has customerId "CUST-001" and the total 100.00, that an
      unknown id gives an empty result, and that placeOrder with quantity 0 throws
      IllegalArgumentException.
    create:
      - src/main/java/no/experis/orders/OrderService.java
      - src/test/java/no/experis/orders/OrderServiceTest.java
    read_only:
      - src/main/java/no/experis/orders/Order.java
    covers: [a-placed-order-can-be-looked-up-by-its-id]
