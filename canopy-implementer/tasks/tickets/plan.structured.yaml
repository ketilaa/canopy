# The structured plan schema's golden fixture (Phase 1 of
# docs/design/structured-plan-schema-introduction-plan.md), hand-authored from the same facts as the
# existing hand-written tickets plan (tasks/tickets/plan-checklist-api.yaml, 10/10) and the gap analysis
# in docs/open-questions/planner-input-human-facts.md. `api` below is copied verbatim from api.txt in
# this directory — keep the two in sync if either changes.
id: tickets

api: |
  Package no.experis.tickets.
  enum TicketStatus { ISSUED, VALIDATED, CANCELLED }. record Ticket(String id, LocalDateTime issuedAt, TicketStatus status); Ticket validate(LocalDateTime at) and Ticket cancel() return a new ticket and throw IllegalStateException. Responsibility: the state of one ticket: validating within 90 minutes of issuedAt, cancelling, and their rejections (expired, already validated, cancelled, a validated ticket cannot be cancelled); it knows nothing about other tickets or about unknown ids.
  interface TicketRepository: Optional<Ticket> findById(String id); void save(Ticket ticket). class InMemoryTicketRepository implements it, no-argument constructor. Responsibility: keeping and finding tickets by id; saving a ticket again replaces the one with the same id.
  class TicketService, constructor TicketService(TicketRepository): Ticket issue(String id, LocalDateTime at); Ticket validate(String id, LocalDateTime at); Ticket cancel(String id); an unknown id throws IllegalArgumentException. Responsibility: issuing tickets and validating and cancelling them by id through the repository; an unknown ticket.

non_goals:
  - "Concurrency or thread safety of the repository"
  - "Any persistence beyond an in-memory HashMap"
  - "Reading the system clock anywhere; every time is passed in by the caller"

decisions:
  - id: boundary-inclusive
    question: Is the 90-minute validation window inclusive of the boundary instant?
    answer: "Yes: exactly 90 minutes after issuedAt is still valid."
    resolved_by: human
  - id: validate-preserves-issued-at
    question: Does validate change issuedAt?
    answer: "No: only status changes. id and issuedAt are immutable across validate and cancel."
    resolved_by: human
  - id: rejection-precedence
    question: When cancelled and expired both apply, which rejection wins?
    answer: "Checked in this order: cancelled, already-validated, expired."
    resolved_by: human

units:
  # Aligned 1:1, in order, with the three lines of `api` above.
  - id: ticket
    owns_rules: [validation-window, validation-precedence, cancellation-rule]
    depends_on: []
    covers:
      - a-ticket-is-valid-for-90-minutes-from-when-it-was-issued
      - a-validated-ticket-cannot-be-validated-again
      - a-ticket-that-is-not-validated-can-be-cancelled
      - a-cancelled-ticket-cannot-be-validated
      - a-validated-ticket-cannot-be-cancelled
    rules: >
      Ticket is immutable: validate returns a new ticket with the status VALIDATED, and cancel returns a
      new ticket with the status CANCELLED; the original is never changed.
    methods:
      - signature: "Ticket.validate(LocalDateTime at)"
        preserves: [id, issuedAt]
        throws:
          - {order: 1, exception_type: IllegalStateException, message: "Ticket is cancelled", condition: "the ticket is cancelled"}
          - {order: 2, exception_type: IllegalStateException, message: "Ticket is already validated", condition: "the ticket is already validated"}
          - {order: 3, exception_type: IllegalStateException, message: "Ticket has expired", condition: "at is more than 90 minutes after issuedAt"}
      - signature: "Ticket.cancel()"
        preserves: [id, issuedAt]
        throws:
          - {order: 1, exception_type: IllegalStateException, message: "A validated ticket cannot be cancelled", condition: "the ticket is validated"}
    examples:
      - id: valid-at-boundary
        setup: 'Ticket ticket = new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED)'
        setup_values: {issuedAt: "2026-03-01T10:00"}
        defines: [ticket]
        call: 'ticket.validate(LocalDateTime.of(2026, 3, 1, 11, 30))'
        expect: {status: VALIDATED}
      - id: expired-one-minute-past
        setup: 'Ticket ticket = new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED)'
        defines: [ticket]
        call: 'ticket.validate(LocalDateTime.of(2026, 3, 1, 11, 31))'
        expect: {throws: IllegalStateException, message: "Ticket has expired"}
      - id: preserves-fields-on-validate
        setup: 'Ticket ticket = new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED)'
        setup_values: {issuedAt: "2026-03-01T10:00"}
        defines: [ticket]
        call: 'ticket.validate(LocalDateTime.of(2026, 3, 1, 10, 30))'
        expect: {status: VALIDATED, issuedAt: "2026-03-01T10:00"}
      - id: cancel-then-validate-rejected
        setup: 'Ticket ticket = new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED).cancel()'
        defines: [ticket]
        call: 'ticket.validate(LocalDateTime.of(2026, 3, 1, 10, 10))'
        expect: {throws: IllegalStateException, message: "Ticket is cancelled"}
      - id: validate-then-cancel-rejected
        setup: 'Ticket ticket = new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED).validate(LocalDateTime.of(2026, 3, 1, 10, 10))'
        defines: [ticket]
        call: 'ticket.cancel()'
        expect: {throws: IllegalStateException, message: "A validated ticket cannot be cancelled"}

  - id: ticket-repository
    owns_rules: [save-replaces-by-id]
    depends_on: [ticket]
    covers: [an-issued-ticket-is-issued]
    rules: >
      InMemoryTicketRepository keeps and finds tickets by id; saving a ticket again replaces the one
      with the same id.
    methods: []
    examples:
      - id: find-missing-is-empty
        setup: "InMemoryTicketRepository repository = new InMemoryTicketRepository()"
        defines: [repository]
        call: 'repository.findById("T-9")'
        expect: {empty: "true"}
      - id: save-then-find
        setup: 'repository.save(new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED))'
        call: 'repository.findById("T-1")'
        expect: {present: "true", status: ISSUED}
      - id: save-replaces-by-id
        setup: >-
          repository.save(new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.ISSUED));
          repository.save(new Ticket("T-1", LocalDateTime.of(2026, 3, 1, 10, 0), TicketStatus.CANCELLED))
        call: 'repository.findById("T-1")'
        expect: {present: "true", status: CANCELLED}

  - id: ticket-service
    owns_rules: [unknown-ticket-rejection]
    depends_on: [ticket, ticket-repository]
    covers:
      - an-issued-ticket-is-issued
      - an-unknown-ticket-cannot-be-validated-or-cancelled
    rules: >
      TicketService loads a ticket from the repository, calls validate or cancel on it, saves the result
      and returns it. Ticket owns the validation and cancellation rules; the service only loads, calls
      and saves.
    methods:
      - signature: "TicketService.validate(String id, LocalDateTime at)"
        throws:
          - {order: 1, exception_type: IllegalArgumentException, message: "Unknown ticket", condition: "the repository returns no ticket for the given id"}
      - signature: "TicketService.cancel(String id)"
        throws:
          - {order: 1, exception_type: IllegalArgumentException, message: "Unknown ticket", condition: "the repository returns no ticket for the given id"}
    examples:
      - id: issue-sets-status
        setup: "TicketService service = new TicketService(new InMemoryTicketRepository())"
        defines: [service]
        call: 'service.issue("T-1", LocalDateTime.of(2026, 3, 1, 10, 0))'
        expect: {status: ISSUED}
      - id: unknown-ticket-rejected-on-validate
        setup: "TicketService service = new TicketService(new InMemoryTicketRepository())"
        defines: [service]
        call: 'service.validate("T-9", LocalDateTime.of(2026, 3, 1, 10, 0))'
        expect: {throws: IllegalArgumentException, message: "Unknown ticket"}
      - id: unknown-ticket-rejected-on-cancel
        setup: "TicketService service = new TicketService(new InMemoryTicketRepository())"
        defines: [service]
        call: 'service.cancel("T-9")'
        expect: {throws: IllegalArgumentException, message: "Unknown ticket"}
