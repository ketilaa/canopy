id: order
story: |
  A customer can place an order for a product in a quantity. The order total is the product price times
  the quantity, less 10 percent when that net total is 500.00 or more. A quantity that is zero or
  negative is rejected. A placed order can be looked up by its id.
feature: tasks/order/feature.feature
steps:
  - id: order-1-order
    instruction: |
      Create the class Order in the package no.experis.orders: a Java record with an id (UUID), a customerId (String), a productId (String), a quantity (int) and a total (BigDecimal). Add a static factory method Order.place(String customerId, String productId, BigDecimal unitPrice, int quantity) that generates a random UUID for the id and computes the total: unitPrice times quantity, and when that amount is 500.00 or more, 10 percent less. The total always has two decimals (setScale(2, RoundingMode.HALF_UP)), so new BigDecimal("480.00") equals it. A quantity of zero or less makes place throw IllegalArgumentException with the message "Quantity must be positive".

      Add OrderTest. It MUST contain one test for each item of this checklist, and you must not leave any item out. Before you submit, go through the list and check that every item has its test.
      1. Unit price 100.00, quantity 1: the total is 100.00.
      2. Unit price 60.00, quantity 8: the total is 480.00.
      3. Unit price 60.00, quantity 9: the total is 486.00.
      4. Unit price 60.00, quantity 10: the total is 540.00.
      5. Unit price 100.00, quantity 5: the total is 450.00 (an amount of exactly 500.00 gets the discount).
      6. Quantity 0: place throws IllegalArgumentException, and the test checks that its message equals "Quantity must be positive".
      7. Quantity -1: place throws IllegalArgumentException, and the test checks that its message equals "Quantity must be positive".
      8. Two placed orders get different ids.
    create:
      - src/main/java/no/experis/orders/Order.java
      - src/test/java/no/experis/orders/OrderTest.java
    covers: [place-an-order-for-one-product, a-net-total-of-500-00-or-more-gets-a-10-percent-volume-discount, a-quantity-that-is-not-positive-is-rejected]
  - id: order-2-service
    instruction: >
      Create OrderService in the package no.experis.orders, with a no-argument constructor and a
      HashMap from id to Order. Add the method Order placeOrder(String customerId, String productId,
      BigDecimal unitPrice, int quantity), which creates the order with Order.place, stores it by its id
      and returns it, and the method Optional<Order> findById(UUID id). Add OrderServiceTest with tests
      that an order placed for customer "CUST-001" and product "PROD-A" at 100.00, quantity 1, can be
      found by its id and that the found order has customerId "CUST-001" and the total 100.00, that an
      unknown id gives an empty result, and that placeOrder with quantity 0 throws
      IllegalArgumentException.
    create:
      - src/main/java/no/experis/orders/OrderService.java
      - src/test/java/no/experis/orders/OrderServiceTest.java
    read_only:
      - src/main/java/no/experis/orders/Order.java
    covers: [a-placed-order-can-be-looked-up-by-its-id]
