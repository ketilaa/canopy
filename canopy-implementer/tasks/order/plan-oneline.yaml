id: order
story: |
  A customer can place an order for a product in a quantity. The order total is the product price times
  the quantity, less 10 percent when that net total is 500.00 or more. A quantity that is zero or
  negative is rejected. A placed order can be looked up by its id.
feature: tasks/order/feature.feature
steps:
  - id: order-1-order
    instruction: |
      Create the record Order in the package no.experis.orders with the components UUID id, String customerId, String productId, int quantity and BigDecimal total, and a static factory method Order.place(String customerId, String productId, BigDecimal unitPrice, int quantity) that makes an order whose total is the price times the quantity, less 10 percent from 500.00, and rejects a quantity that is not positive. Add OrderTest.
    create:
      - src/main/java/no/experis/orders/Order.java
      - src/test/java/no/experis/orders/OrderTest.java
    covers: [place-an-order-for-one-product, a-net-total-of-500-00-or-more-gets-a-10-percent-volume-discount, a-quantity-that-is-not-positive-is-rejected]
  - id: order-2-service
    instruction: |
      Create OrderService in the package no.experis.orders with a no-argument constructor, Order placeOrder(String customerId, String productId, BigDecimal unitPrice, int quantity) that places and stores an order, and Optional<Order> findById(UUID id). Add OrderServiceTest.
    create:
      - src/main/java/no/experis/orders/OrderService.java
      - src/test/java/no/experis/orders/OrderServiceTest.java
    read_only:
      - src/main/java/no/experis/orders/Order.java
    covers: [a-placed-order-can-be-looked-up-by-its-id]
