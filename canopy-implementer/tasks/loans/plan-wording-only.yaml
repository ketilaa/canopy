id: loans
story: |
  A member can borrow a book for 14 days. A member can have at most 3 active loans, and a book that is on
  loan cannot be borrowed. Returning a book after its due date costs 0.50 per day late. A returned book can
  be borrowed again.
feature: tasks/loans/feature.feature
steps:
  - id: loans-1-loan
    instruction: |
      Create the record Loan in the package no.experis.loans with the components String memberId, String isbn, LocalDate borrowedOn and LocalDate dueOn. Add the static factory method Loan.start(String memberId, String isbn, LocalDate borrowedOn), which sets dueOn to 14 days after borrowedOn. Add the method BigDecimal lateFee(LocalDate returnedOn): the fee is 0.50 for each whole day after dueOn, and 0.00 when the book is returned on or before dueOn; the fee always has two decimals.
      Add LoanTest. It MUST contain one test for each item of this checklist, and you must not leave any item out. Before you submit, go through the list and check that every item has its test.
      1. The due date is 14 days after the date the loan starts.
      2. The late fee for a return before the due date.
      3. The late fee for a return on the due date.
      4. The late fee for a return one day after the due date.
      5. The late fee for a return several days after the due date.
    create:
      - src/main/java/no/experis/loans/Loan.java
      - src/test/java/no/experis/loans/LoanTest.java
    covers: [a-book-is-lent-for-14-days, a-late-return-costs-0-50-per-day-after-the-due-date]
  - id: loans-2-service
    instruction: |
      Create LoanService in the package no.experis.loans with a no-argument constructor and a map of the loans that are active, by isbn. Add Loan borrow(String memberId, String isbn, LocalDate today), which starts a loan with Loan.start and stores it. It throws IllegalStateException with the message "Book is already on loan" when the isbn is on loan to anyone, and IllegalStateException with the message "Loan limit reached" when the member already has 3 active loans. Add BigDecimal returnBook(String isbn, LocalDate today), which removes the loan and returns its late fee; it throws IllegalArgumentException with the message "Book is not on loan" when the isbn is not on loan. Add int activeLoans(String memberId).

      Add LoanServiceTest. It MUST contain one test for each item of this checklist, and you must not leave any item out. Before you submit, go through the list and check that every item has its test.
      1. Borrowing a book returns the loan with its due date, and the member then has one active loan.
      2. A member with 3 active loans cannot borrow a fourth, and the number of active loans stays 3.
      3. A book that is on loan to one member cannot be borrowed by another member.
      4. After a book is returned, the member can borrow again and another member can borrow that book.
      5. Returning a book returns the late fee.
      6. Returning a book that is not on loan is rejected.
    create:
      - src/main/java/no/experis/loans/LoanService.java
      - src/test/java/no/experis/loans/LoanServiceTest.java
    read_only:
      - src/main/java/no/experis/loans/Loan.java
    covers: [a-member-can-have-at-most-3-active-loans, a-book-that-is-on-loan-cannot-be-borrowed, a-returned-book-can-be-borrowed-again-and-frees-the-member-s-loan-slot, returning-a-book-that-is-not-on-loan-is-rejected]
