id: widgets
story: |
  A client can create a widget with POST /widgets, giving a name. The widget gets a generated id. A
  name that is blank, missing, or longer than 50 characters is rejected.

  Feature: Create a widget
    Scenario: A valid name creates a widget with a generated id
      When a client posts a widget named "Alpha"
      Then the response status is 201
      And the response has a generated id and the name "Alpha"

    Scenario Outline: An invalid name is rejected
      When a client posts a widget with <name>
      Then the response status is 400

      Examples:
        | name                   |
        | a blank name           |
        | no name                |
        | a name of 51 characters |
steps:
  - id: widgets-1-domain
    instruction: >
      Create the class Widget in the package com.example.widgets.domain: a Java record with an id (UUID)
      and a name (String). A name is valid when it is not null, not blank, and at most 50 characters long;
      the constructor throws IllegalArgumentException for an invalid name and for a null id. Add a static
      factory method Widget.create(String name) that generates a random UUID for the id. Add WidgetTest
      with tests that create gives the widget a generated id, that two created widgets get different ids,
      that a valid name is kept, that null, blank and 51-character names are rejected, and that a
      50-character name is accepted.
    create:
      - src/main/java/com/example/widgets/domain/Widget.java
      - src/test/java/com/example/widgets/domain/WidgetTest.java
  - id: widgets-2-repository
    instruction: >
      In the package com.example.widgets.repository, create the interface WidgetRepository with the
      methods Widget save(Widget widget) and Optional<Widget> findById(UUID id). Create
      InMemoryWidgetRepository in the same package, annotated with @Repository, implementing it with a
      ConcurrentHashMap keyed by id; save stores the widget unchanged and returns it. Add
      InMemoryWidgetRepositoryTest with tests that a saved widget can be found by its id, that an unknown
      id gives an empty result, and that saving a widget with an id that already exists replaces it.
    create:
      - src/main/java/com/example/widgets/repository/WidgetRepository.java
      - src/main/java/com/example/widgets/repository/InMemoryWidgetRepository.java
      - src/test/java/com/example/widgets/repository/InMemoryWidgetRepositoryTest.java
    read_only:
      - src/main/java/com/example/widgets/domain/Widget.java
  - id: widgets-3-service
    instruction: >
      In the package com.example.widgets.service, create WidgetService, annotated with @Service, with a
      constructor that takes a WidgetRepository. Add the method Widget create(String name), which creates
      a widget with Widget.create(name), saves it through the repository, and returns the saved widget. An
      invalid name makes it throw IllegalArgumentException. WidgetService must not get a getter for its
      repository. Add WidgetServiceTest. In the test, create the repository yourself with
      InMemoryWidgetRepository repository = new InMemoryWidgetRepository(); and the service with
      new WidgetService(repository). Write tests that create returns a widget with the given name and a
      generated id, that the widget was saved, checked by calling repository.findById(widget.id()) on the
      repository you created, and that create throws IllegalArgumentException for each of these invalid names: null, "" (empty), "   " (spaces only) and a name of 51 characters. A name that contains spaces but has other characters is valid; do not test it as invalid.
    create:
      - src/main/java/com/example/widgets/service/WidgetService.java
      - src/test/java/com/example/widgets/service/WidgetServiceTest.java
    read_only:
      - src/main/java/com/example/widgets/domain/Widget.java
      - src/main/java/com/example/widgets/repository/WidgetRepository.java
      - src/main/java/com/example/widgets/repository/InMemoryWidgetRepository.java
  - id: widgets-4-controller
    instruction: >
      In the package com.example.widgets.web, create WidgetController, annotated with @RestController,
      with a constructor that takes a WidgetService and no other dependency. POST /widgets takes a JSON
      body with a name, read into a small record CreateWidgetRequest(String name) in the same package,
      calls WidgetService.create, and answers status 201 with the created widget as JSON containing id
      and name, using ResponseEntity and org.springframework.http.HttpStatus. The controller must use only
      the service and never the repository. Add WidgetControllerTest as a plain JUnit 5 test class with no
      Spring annotations and no Mockito. Build the MockMvc like this: MockMvc mvc =
      MockMvcBuilders.standaloneSetup(new WidgetController(new WidgetService(new InMemoryWidgetRepository()))).build();
      Write exactly one test method and no other: perform post("/widgets") with contentType(MediaType.APPLICATION_JSON) and the content
      "{\"name\":\"Alpha\"}", and expect status().isCreated(), jsonPath("$.id").exists() and
      jsonPath("$.name").value("Alpha").
    create:
      - src/main/java/com/example/widgets/web/CreateWidgetRequest.java
      - src/main/java/com/example/widgets/web/WidgetController.java
      - src/test/java/com/example/widgets/web/WidgetControllerTest.java
    read_only:
      - src/main/java/com/example/widgets/domain/Widget.java
      - src/main/java/com/example/widgets/service/WidgetService.java
      - src/main/java/com/example/widgets/repository/InMemoryWidgetRepository.java
  - id: widgets-5-validation
    instruction: >
      When WidgetService.create throws IllegalArgumentException, POST /widgets must answer status 400.
      Change WidgetController to catch it and answer 400. Add two tests to WidgetControllerTest, keeping
      the existing test: posting a JSON body with the name "" gives status 400, and posting an empty JSON
      body {} (no name) gives status 400.
    modify:
      - src/main/java/com/example/widgets/web/WidgetController.java
      - src/test/java/com/example/widgets/web/WidgetControllerTest.java
    read_only:
      - src/main/java/com/example/widgets/service/WidgetService.java
      - src/main/java/com/example/widgets/web/CreateWidgetRequest.java
