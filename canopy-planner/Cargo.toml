[package]
name = "canopy-planner"
version = "0.1.0"
edition = "2021"
description = "Isolated Planner: turns a story and a Gherkin feature into a plan the Implementer can run. Not yet part of canopy-cli."
license.workspace = true

# Depends on canopy-implementer for the plan format, the LLM client and the observer, and on no other
# canopy crate. The dependency points one way: the Implementer never knows the Planner.
[dependencies]
canopy-implementer = { path = "../canopy-implementer" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
regex = "1"
ureq = { version = "2", features = ["json"] }
